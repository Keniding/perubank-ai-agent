[project]
name = "perubank-ai-agent"
version = "1.0.0"
description = "Multi-Agent Banking System powered by AMD Instinct MI300X"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Team LEAD", email = "team-lead@example.com" },
]
keywords = ["ai", "agents", "banking", "amd", "langgraph", "llm", "rocm"]

dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langgraph>=0.4.0,<0.5.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length    = 100
target-version = ["py312", "py313"]

[tool.ruff]
line-length    = 100
target-version = "py313"
exclude        = [
    "notebooks/",
    ".venv/",
    "dist/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["ALL"]

[tool.mypy]
python_version      = "3.12"
warn_return_any     = true
warn_unused_configs = true
